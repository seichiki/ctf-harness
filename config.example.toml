# Copy this to .local/config.toml, or run ./ctf-start setup.
# Use a model ID offered by your own Codex account. No model is assumed.
model = "SET_YOUR_AVAILABLE_MODEL_ID"
effort = "medium"
daybreak = "off"
orchestration = "single"
network_access = "off" # sandbox outbound network request; set "on" only for an authorized live target
progress = false       # safe terminal status on stderr for external runs
proxy_url = ""         # optional HTTP proxy endpoint, for example "http://127.0.0.1:8080"
writeup_draft = false # after owner-confirmed acceptance, ask a separate GPT run for an evidence-based draft
deepseek_enabled = false # multi only: send eligible UTF-8 case files to DeepSeek API before verifier
deepseek_model = "deepseek-flash" # key from project .env (chmod 600) or DEEPSEEK_API_KEY environment variable

# Optional overrides; omitted fields use the shared values above.
# Available roles: solver (single), verifier, solver_a, solver_b,
# verifier_review (multi), writeup (draft), interactive (terminal mode).
# Exception: writeup Daybreak defaults off unless explicitly set for writeup.
# Replace model IDs with ones available to your own account.
# [role_settings.verifier]
# model = "YOUR_VERIFIER_MODEL_ID"
# effort = "high"
# daybreak = "blue"
# [role_settings.solver_a]
# model = "YOUR_SOLVER_A_MODEL_ID"
# [role_settings.solver_b]
# model = "YOUR_SOLVER_B_MODEL_ID"
# [role_settings.verifier_review]
# model = "YOUR_REVIEW_MODEL_ID"
# [role_settings.solver]
# model = "YOUR_SINGLE_MODEL_ID"
# [role_settings.writeup]
# model = "YOUR_WRITEUP_MODEL_ID"
# daybreak = "off"
# [role_settings.interactive]
# model = "YOUR_INTERACTIVE_MODEL_ID"
